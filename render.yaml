services:
  - type: web
    name: nt-pdf-archiver
    runtime: node
    plan: starter            # free plan has no persistent disk
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SYNC_CRON
        value: "30 2 * * *"
      - key: DATA_DIR
        value: /var/data
      - key: API_KEY
        sync: false          # set manually in dashboard (optional)
    disk:
      name: nt-data
      mountPath: /var/data
      sizeGB: 1
