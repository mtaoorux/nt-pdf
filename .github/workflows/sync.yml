name: Daily PDF URL sync

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC every day
  workflow_dispatch: # manual "Run workflow" button in GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl APIs and append new PDF URLs
        run: node sync.mjs
      - name: Commit new data (append-only)
        run: |
          git config user.name "nt-pdf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new PDF URLs today."
          else
            git commit -m "daily sync: $(date -u +%Y-%m-%d)"
            git push
          fi
